<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>056 — Confetti Burst Button</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e14;
    --card: #151a24;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #14b8a6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  a.back {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    z-index: 2;
  }
  a.back:hover { color: var(--text); }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 2rem;
    position: relative;
    z-index: 1;
  }

  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
  p.hint { color: var(--muted); font-size: 0.85rem; margin: 0; text-align: center; }

  button {
    font: inherit;
    font-weight: 600;
    color: #06201c;
    background: var(--accent);
    border: none;
    padding: 0.85rem 1.75rem;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button:active { transform: scale(0.95); }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<a class="back" href="../../index.html">← daily-lab</a>
<canvas id="confetti"></canvas>
<main>
  <h1>056 — Confetti Burst Button</h1>
  <p class="hint">Click the button. Pure canvas + requestAnimationFrame, no physics library.</p>
  <button id="burst">Celebrate 🎉</button>
</main>
<script>
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  const colors = ["#14b8a6", "#f472b6", "#facc15", "#60a5fa", "#f87171"];
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  function burst(x, y) {
    const count = 90;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 4 + Math.random() * 7;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 4 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 0.4,
        life: 1,
      });
    }
  }

  let running = false;
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p) => {
      p.vy += 0.18;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.spin;
      p.life -= 0.012;

      ctx.save();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    particles = particles.filter((p) => p.life > 0 && p.y < canvas.height + 50);

    if (particles.length > 0) {
      requestAnimationFrame(tick);
    } else {
      running = false;
    }
  }

  document.getElementById("burst").addEventListener("click", (e) => {
    burst(e.clientX, e.clientY);
    if (!running) {
      running = true;
      requestAnimationFrame(tick);
    }
  });
</script>
</body>
</html>
