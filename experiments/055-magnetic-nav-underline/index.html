<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>055 — Magnetic Nav Underline</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e14;
    --card: #151a24;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #14b8a6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  a.back {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  a.back:hover { color: var(--text); }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 2rem;
  }

  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
  p.hint { color: var(--muted); font-size: 0.85rem; margin: 0; }

  nav {
    position: relative;
    display: flex;
    gap: 2rem;
    padding: 1rem 1.5rem;
    background: var(--card);
    border-radius: 0.75rem;
  }

  nav a {
    position: relative;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
    padding-bottom: 0.35rem;
    transition: color 0.2s ease;
    z-index: 1;
  }
  nav a:hover, nav a:focus-visible { color: var(--text); }

  .underline {
    position: absolute;
    bottom: 1rem;
    left: 0;
    height: 2px;
    width: 0;
    background: var(--accent);
    border-radius: 2px;
    pointer-events: none;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), width 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    opacity: 0;
  }
</style>
</head>
<body>
<a class="back" href="../../index.html">← daily-lab</a>
<main>
  <h1>055 — Magnetic Nav Underline</h1>
  <p class="hint">Hover the links — the underline slides and stretches to match, instead of teleporting.</p>
  <nav id="nav">
    <a href="#">Overview</a>
    <a href="#">Pricing</a>
    <a href="#">Documentation</a>
    <a href="#">Community</a>
    <a href="#">Changelog</a>
    <span class="underline" id="underline"></span>
  </nav>
</main>
<script>
  const nav = document.getElementById("nav");
  const underline = document.getElementById("underline");
  const links = nav.querySelectorAll("a");

  function moveTo(el) {
    const navRect = nav.getBoundingClientRect();
    const rect = el.getBoundingClientRect();
    const x = rect.left - navRect.left;
    underline.style.width = rect.width + "px";
    underline.style.transform = `translateX(${x}px)`;
    underline.style.opacity = "1";
  }

  links.forEach((link) => {
    link.addEventListener("mouseenter", () => moveTo(link));
    link.addEventListener("focus", () => moveTo(link));
  });

  nav.addEventListener("mouseleave", () => {
    underline.style.opacity = "0";
  });
</script>
</body>
</html>
