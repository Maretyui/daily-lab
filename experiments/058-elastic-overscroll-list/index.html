<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>058 — Elastic Overscroll List</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e14;
    --card: #151a24;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #14b8a6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  a.back {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  a.back:hover { color: var(--text); }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    padding: 2rem;
  }

  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
  p.hint { color: var(--muted); font-size: 0.85rem; margin: 0; text-align: center; max-width: 24rem; }

  .frame {
    width: 20rem;
    height: 22rem;
    background: var(--card);
    border-radius: 0.75rem;
    overflow: hidden;
    position: relative;
    border: 1px solid #232a38;
  }

  .viewport {
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .viewport::-webkit-scrollbar { display: none; }

  .stretch {
    will-change: transform;
  }

  .row {
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid #1e2430;
    font-size: 0.85rem;
  }
  .row:last-child { border-bottom: none; }
  .row .n { color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 0.5rem; }
</style>
</head>
<body>
<a class="back" href="../../index.html">← daily-lab</a>
<main>
  <h1>058 — Elastic Overscroll List</h1>
  <p class="hint">Drag past the top or bottom of the list (mouse drag or touch) — the content rubber-bands with a resistance curve, then springs back on release, mimicking iOS's overscroll bounce without any native scroll-snap support.</p>
  <div class="frame">
    <div class="viewport" id="viewport">
      <div class="stretch" id="stretch"></div>
    </div>
  </div>
</main>
<script>
  const viewport = document.getElementById("viewport");
  const stretch = document.getElementById("stretch");

  for (let i = 1; i <= 24; i++) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="n">${String(i).padStart(2, "0")}</span>Row item ${i}`;
    stretch.appendChild(row);
  }

  // Resistance curve: the further past the edge you drag, the less the
  // content actually moves - classic rubber-band feel (tanh-shaped falloff).
  function resist(overshoot) {
    const max = 90;
    return max * Math.tanh(overshoot / max);
  }

  let dragging = false;
  let startY = 0;
  let startScrollTop = 0;
  let overshoot = 0;
  let springFrame = null;

  function maxScroll() {
    return stretch.scrollHeight - viewport.clientHeight;
  }

  function pointerDown(y) {
    if (springFrame) cancelAnimationFrame(springFrame);
    dragging = true;
    startY = y;
    startScrollTop = viewport.scrollTop;
  }

  function pointerMove(y) {
    if (!dragging) return;
    const delta = startY - y; // positive = dragging content up
    let wantedScrollTop = startScrollTop + delta;

    const min = 0;
    const max = maxScroll();

    if (wantedScrollTop < min) {
      overshoot = resist(min - wantedScrollTop);
      viewport.scrollTop = min;
      stretch.style.transform = `translateY(${overshoot}px)`;
    } else if (wantedScrollTop > max) {
      overshoot = resist(wantedScrollTop - max);
      viewport.scrollTop = max;
      stretch.style.transform = `translateY(${-overshoot}px)`;
    } else {
      overshoot = 0;
      stretch.style.transform = "translateY(0px)";
      viewport.scrollTop = wantedScrollTop;
    }
  }

  function pointerUp() {
    dragging = false;
    if (overshoot === 0) return;
    springBack();
  }

  function springBack() {
    let current = parseFloat(stretch.style.transform.replace(/[^-\d.]/g, "")) || 0;
    let velocity = 0;
    const stiffness = 260;
    const damping = 22;

    function step() {
      const force = -current * stiffness;
      const dampingForce = -velocity * damping;
      velocity += (force + dampingForce) * (1 / 60);
      current += velocity * (1 / 60);
      stretch.style.transform = `translateY(${current}px)`;

      if (Math.abs(current) > 0.2 || Math.abs(velocity) > 0.2) {
        springFrame = requestAnimationFrame(step);
      } else {
        stretch.style.transform = "translateY(0px)";
        overshoot = 0;
      }
    }
    springFrame = requestAnimationFrame(step);
  }

  viewport.addEventListener("mousedown", (e) => pointerDown(e.clientY));
  window.addEventListener("mousemove", (e) => pointerMove(e.clientY));
  window.addEventListener("mouseup", pointerUp);

  viewport.addEventListener("touchstart", (e) => pointerDown(e.touches[0].clientY), { passive: true });
  viewport.addEventListener("touchmove", (e) => pointerMove(e.touches[0].clientY), { passive: true });
  viewport.addEventListener("touchend", pointerUp);
</script>
</body>
</html>
